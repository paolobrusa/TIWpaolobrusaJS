<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Aste - SPA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="aste-container">
    <!-- Header principale -->
    <div class="aste-header">
        <h1>Manager Aste Online</h1>
        <p id="page-subtitle">Gestisci le tue aste</p>
    </div>

    <!-- Barra di navigazione -->
    <div class="section-container" style="margin-bottom: 2rem;">
        <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
            <button class="btn-dettaglio" id="nav-acquisto" onclick="app.showSection('acquisto')">
                Acquisto
            </button>
            <button class="btn-dettaglio" id="nav-vendo" onclick="app.showSection('vendo')">
                Vendo
            </button>
            <button class="btn-logout" onclick="app.logout()">
                Logout
            </button>
        </div>
    </div>

    <div id="message-container"></div>
    <div id="content"></div>
</div>
<script src="scripts/prova1.js" charset="utf-8" defer></script>
</body>
</html>
